server {
    listen 3001;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ws {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Streaming de log fica com a conexão WS aberta por tempo indeterminado;
        # sem isso o Nginx derruba a conexão ociosa após o timeout padrão (60s).
        proxy_read_timeout 3600s;
    }

    # Nomes com hash do Vite: conteúdo imutável, cache longo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html referencia os assets com hash; precisa ser revalidado a cada acesso.
    # Também atende o fallback de SPA do try_files abaixo (redirect interno).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
