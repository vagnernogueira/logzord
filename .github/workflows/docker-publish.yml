name: Docker publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    secrets:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

  build:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version da tag sendo publicada
        id: tag
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Consistencia tag vs package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          pkg_version=$(node -p "require('./package.json').version")
          tag_version="${{ steps.tag.outputs.version }}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "::error::Versao do package.json ($pkg_version) != versao da tag ($tag_version)"
            exit 1
          fi
          echo "Versao coerente: $pkg_version"

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/vagnernogueira/logzord
          tags: |
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}
            type=semver,pattern=v{{major}}.{{minor}}

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_URL=${{ secrets.FRONTEND_HTTP_URL }}
            VITE_WS_URL=${{ secrets.FRONTEND_WS_URL }}
          secrets: |
            GITHUB_TOKEN=${{ secrets.GH_PACKAGES_TOKEN }}
