version: '3.8'

services:
  logzord:
    # Puxa a imagem publicada no GHCR (ver .github/workflows/docker-publish.yml).
    # Para testar um build local em vez do registry, comente a linha `image:`
    # abaixo e descomente o bloco `build:` (requer GITHUB_TOKEN, ver `make build`).
    image: ghcr.io/vagnernogueira/logzord:latest
    # build:
    #   context: .
    #   dockerfile: Containerfile
    container_name: logzord
    ports:
      - "3001:3001"
    volumes:
      # Montagem do arquivo de targets e do diretório de logs para leitura (ro = read-only)
      - ./backend/targets.json:/app/targets.json:ro
      - ./wkr:/app/wkr:ro
      - /var/log:/var/log:ro
    restart: unless-stopped
    environment:
      - NODE_ENV=production
